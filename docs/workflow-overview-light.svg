<line class="arrow" x1="387" y1="150" x2="419" y2="150" marker-end="url(#ah-h)"/>
<line class="arrow" x1="485" y1="150" x2="517" y2="150" marker-end="url(#ah-h)"/>
<line class="arrow" x1="627" y1="150" x2="659" y2="150" marker-end="url(#ah-h)"/>
<line class="arrow" x1="725" y1="150" x2="757" y2="150" marker-end="url(#ah-h)"/>
<line class="arrow" x1="867" y1="150" x2="899" y2="150" marker-end="url(#ah-h)"/>
<line class="arrow" x1="966" y1="150" x2="1002" y2="150" marker-end="url(#ah-h)"/>
<text class="end" x="1008" y="155">마무리</text>
<line class="ai-arrow back" x1="212" y1="117" x2="212" y2="72" marker-end="url(#ah-h-ai)"/>
<text class="lbl" x="219" y="106" style="text-anchor:start">다시 질문</text>
<rect class="tag" x="137" y="213" width="150" height="20" rx="10"/>
<text class="tag-text" x="212" y="227">문서 규칙 · 훅 · 독자 테스트</text>
<g class="ret"><path d="M741 152 V250 H92 V178" marker-end="url(#ah-h-ret)"/><path d="M501 152 V250"/><text x="296" y="269">설계 허점을 찾으면 재설계하거나 기술 부채로 남김</text></g>
</svg>
