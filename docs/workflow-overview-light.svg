<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 282" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">작업 흐름. 각 단계의 산출물이 개발자의 관문을 지나 다음 단계로 간다</title>
<desc id="flow-desc">각 단계의 산출물이 개발자의 관문을 지나야 다음 단계로 넘어간다. 1 Claude가 설계 문서 초안을 작성한다. 개발자가 읽고 이해한다. 이해가 안 되면 다시 질문한다. 문서 규칙과 훅, 독자 테스트가 이 관문에 붙어 있다. 2 Claude가 테스트와 구현을 작성한다. 개발자가 사이클마다 리뷰하고 커밋한다. 리뷰에서 설계 허점을 찾으면 설계 문서로 돌아가 재설계할지 기술 부채로 남길지 결정한다. 3 Claude가 앱을 기동해 호출한다. 개발자가 결과를 확인한다. 결과에서 설계 허점을 찾으면 설계 문서로 돌아가 재설계할지 기술 부채로 남길지 결정한다. 4 Claude가 변경 전체를 리뷰한다. 개발자도 전체를 자체 리뷰한다. 개발자가 Claude 리뷰와 자체 리뷰를 대조해 필요한 지적만 남기고 마무리한다.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
text { font-size: 14px; font-weight: 700; fill: #172033; text-anchor: middle; }
.ai { font-size: 12.5px; font-weight: 600; fill: #6d4fc2; }
.gate-label { font-size: 12.5px; fill: #a8730a; }
.lane { font-size: 13px; text-anchor: start; }
.lane.ai-lane { fill: #6d4fc2; }
.lane.dev-lane { fill: #a8730a; }
.lbl { font-size: 11px; font-weight: 600; fill: #6d4fc2; }
.tag-text { font-size: 11px; font-weight: 600; fill: #172033; }
.end { font-size: 13px; fill: #5d6879; text-anchor: start; }
.art { fill: #ffffff; stroke: #dbe1e8; stroke-width: 1.5; }
.gate { fill: #fdf3d8; stroke: #a8730a; stroke-width: 1.8; }
.tag { fill: #f1f4f7; stroke: #5d6879; stroke-width: 1; }
.arrow { fill: none; stroke: #5d6879; stroke-width: 1.8; }
.ahead { fill: #5d6879; }
.ai-arrow { fill: none; stroke: #6d4fc2; stroke-width: 1.8; }
.ai-arrow.back { stroke-dasharray: 4 4; }
.ahead-ai { fill: #6d4fc2; }
.ret path { fill: none; stroke: #5d6879; stroke-width: 1.8; stroke-dasharray: 6 5; }
.ahead-ret { fill: #5d6879; }
.ret text { font-size: 12px; font-weight: 600; fill: #5d6879; }
{ width: 100%; left: 0; transform: none; }
</style>
<defs><marker id="ah-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahead"/></marker><marker id="ah-h-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahead-ai"/></marker><marker id="ah-h-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahead-ret"/></marker></defs>
